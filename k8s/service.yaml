# ClusterIP: a stable in-cluster virtual IP for the pods. Not reachable from outside the cluster;
# outside traffic comes in through the Ingress (k8s/ingress.yaml), which terminates TLS.
apiVersion: v1
kind: Service
metadata:
  name: wisecow
  namespace: wisecow
  labels:
    app: wisecow
spec:
  type: ClusterIP
  selector:
    app: wisecow
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
