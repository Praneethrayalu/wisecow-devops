apiVersion: v1
kind: Service
metadata:
  name: wisecow
  namespace: wisecow
  labels:
    app: wisecow
spec:
  # ClusterIP is consumed by the Ingress below; switch to NodePort/LoadBalancer for direct exposure.
  type: ClusterIP
  selector:
    app: wisecow
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# Optional direct NodePort exposure (handy on kind/minikube without an ingress controller)
apiVersion: v1
kind: Service
metadata:
  name: wisecow-nodeport
  namespace: wisecow
  labels:
    app: wisecow
spec:
  type: NodePort
  selector:
    app: wisecow
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30499
