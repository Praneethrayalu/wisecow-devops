# Problem Statement 3 (optional): zero-trust KubeArmor policy for the wisecow pods.
#
# Zero trust here means an ALLOW-LIST: the policy names the only processes, files and network
# protocols wisecow needs. Together with the namespace posture in namespace-default-posture.yaml
# (default "block"), anything not listed is denied and logged.
#
# STATUS: syntax validated against the KubeArmor CRD (kubectl apply --dry-run=server) and applied
# to a kind cluster. ENFORCEMENT IS UNVERIFIED: the test machine's kernel had neither BPF-LSM nor
# AppArmor, so KubeArmor ran in visibility-only mode and could not block anything. Verify on a node
# with BPF-LSM/AppArmor (see README "KubeArmor") before claiming it blocks.
#
# Debian 12 uses merged /usr (/bin -> /usr/bin); both spellings are listed to be safe.
apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: wisecow-zero-trust
  namespace: wisecow
spec:
  severity: 7
  tags: ["zero-trust", "wisecow"]
  message: "wisecow zero-trust policy: activity outside the allow-list"
  selector:
    matchLabels:
      app: wisecow
  action: Allow
  process:
    matchPaths:
      - path: /app/wisecow.sh        # entrypoint and per-connection handler
      - path: /usr/bin/bash
      - path: /bin/bash
      - path: /usr/bin/socat         # TCP listener (forks one handler per connection)
      - path: /usr/games/fortune
      - path: /usr/games/cowsay
      - path: /usr/bin/perl          # cowsay is a perl script
      - path: /usr/bin/date          # access-log timestamps
      - path: /usr/bin/realpath      # resolves the handler path at start-up
  file:
    matchDirectories:
      - dir: /app/
        recursive: true
        readOnly: true
      - dir: /usr/
        recursive: true
        readOnly: true               # binaries, shared libraries, perl modules, fortune data, cows
      - dir: /lib/
        recursive: true
        readOnly: true
      - dir: /etc/
        recursive: true
        readOnly: true
      - dir: /proc/
        recursive: true
        readOnly: true
      - dir: /tmp/
        recursive: true              # emptyDir scratch space (normally unused)
    matchPaths:
      - path: /dev/null
      - path: /dev/urandom           # fortune picks a random quote
  network:
    matchProtocols:
      - protocol: tcp                # serving HTTP on 4499; no UDP/DNS or raw sockets needed
