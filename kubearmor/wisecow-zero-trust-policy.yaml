# Problem Statement 3 (optional): zero-trust KubeArmor runtime policy for the wisecow workload.
# Default-deny posture: only the processes wisecow genuinely needs may execute, sensitive paths are
# read-only or blocked, and only the app's own TCP port may be served. Everything else is Blocked + audited.
apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: wisecow-zero-trust
  namespace: wisecow
spec:
  severity: 7
  tags: ["zero-trust", "wisecow", "accuknox"]
  message: "wisecow zero-trust policy violation"
  selector:
    matchLabels:
      app: wisecow
  process:
    matchPaths:
      # allow-list of binaries the wisecow.sh pipeline needs
      - path: /bin/bash
      - path: /usr/bin/bash
      - path: /bin/sh
      - path: /usr/bin/sh
      - path: /usr/bin/nc.openbsd
      - path: /bin/nc.openbsd
      - path: /usr/games/fortune
      - path: /usr/games/cowsay
      - path: /usr/bin/perl           # cowsay is a perl script
      - path: /usr/bin/cat
      - path: /bin/cat
      - path: /usr/bin/rm
      - path: /bin/rm
      - path: /usr/bin/mkfifo
      - path: /bin/mkfifo
      - path: /usr/bin/sleep
      - path: /bin/sleep
      - path: /usr/bin/grep
      - path: /bin/grep
      - path: /usr/bin/printf
      - path: /app/wisecow.sh
    matchDirectories:
      # explicitly block interactive/debug and package tooling from ever running inside the pod
      - dir: /usr/bin/
        recursive: true
        action: Block
      - dir: /usr/sbin/
        recursive: true
        action: Block
      - dir: /usr/local/bin/
        recursive: true
        action: Block
  file:
    matchPaths:
      - path: /etc/passwd
        readOnly: true
      - path: /etc/shadow
        action: Block
      - path: /etc/hosts
        readOnly: true
    matchDirectories:
      - dir: /app/
        recursive: true           # fifo "response" lives here; read-write needed
      - dir: /usr/share/games/
        recursive: true
        readOnly: true            # fortune database + cowsay cows
      - dir: /usr/share/
        recursive: true
        readOnly: true
      - dir: /etc/
        recursive: true
        readOnly: true
      - dir: /proc/
        recursive: true
        readOnly: true
      - dir: /tmp/
        recursive: true
        action: Block             # app never needs /tmp; blocks drop-and-run tooling
      - dir: /var/run/secrets/
        recursive: true
        action: Block             # no access to the service-account token
      - dir: /root/
        recursive: true
        action: Block
  network:
    matchProtocols:
      - protocol: tcp             # served by nc on 4499
    # raw/udp/icmp are not needed; everything not matched becomes Block via the default posture
  capabilities:
    matchCapabilities:
      - capability: net_raw
        action: Block
      - capability: sys_admin
        action: Block
  action: Allow
